<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAP Lamp Options</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">browser-extention-yap</p>
        <h1>Extension settings</h1>
        <p>
          This page is the canonical place for extension configuration.
        </p>
      </header>

      <form id="settings-form" class="card">
        <div class="actions">
          <button type="submit">Сохранить</button>
          <button id="reset-settings" type="button">Восстановить</button>
          <button id="export-settings" type="button">Экспортировать</button>
          <span id="save-status" role="status" aria-live="polite"></span>
        </div>

        <div class="table-wrap">
          <table class="settings-table">
            <thead>
              <tr>
                <th>Параметр</th>
                <th>Значение</th>
                <th>Описание</th>
              </tr>
            </thead>
            <tbody id="settings-table-body"></tbody>
          </table>
        </div>
      </form>
    </main>
  </body>
</html>
