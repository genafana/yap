<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="options_title">YAP Lamp Options</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow" data-i18n="options_eyebrow">YAP Lamp</p>
        <h1 data-i18n="options_heading">Extension settings</h1>
        <p data-i18n="options_description">
          This page is the canonical place for extension configuration.
        </p>
      </header>

      <form id="settings-form" class="card">
        <div class="actions">
          <button type="submit" data-i18n="options_save">Save</button>
          <button id="reset-settings" type="button" data-i18n="options_restore">Restore</button>
          <button id="export-settings" type="button" data-i18n="options_export">Export</button>
          <span id="save-status" role="status" aria-live="polite"></span>
        </div>

        <div class="table-wrap">
          <table class="settings-table">
            <thead>
              <tr>
                <th data-i18n="options_table_parameter">Parameter</th>
                <th data-i18n="options_table_value">Value</th>
                <th data-i18n="options_table_description">Description</th>
              </tr>
            </thead>
            <tbody id="settings-table-body"></tbody>
          </table>
        </div>
      </form>

      <section class="card tags-card">
        <h2 data-i18n="tags_section_heading">Tags &amp; Users</h2>
        <p data-i18n="tags_section_description"></p>

        <div class="actions tags-actions">
          <h3 data-i18n="tags_import_heading">Import</h3>
          <label class="tags-replace-label">
            <input type="checkbox" id="tags-import-replace" />
            <span data-i18n="tags_import_replace">Replace existing data</span>
          </label>
          <input type="file" id="tags-import-file" accept=".json" style="display:none" />
          <button id="tags-import-btn" type="button" data-i18n="tags_import_button">Import file</button>
          <button id="tags-export-btn" type="button" data-i18n="tags_export_button">Export tags &amp; users</button>
          <span id="tags-status" role="status" aria-live="polite"></span>
        </div>
      </section>
    </main>
  </body>
</html>
